<!DOCTYPE html>

<html lang="es">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Comercio Exterior ImegaVentus</title>
    <link href="styles_responsive.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
    <link rel="shortcut icon" href="https://repuestos.ventuscorp.cl/wp-content/uploads/2018/03/FAVICON.jpg" />
  </head>
  <header>
    <!-- Cabecera -->
    <div id="logo" type="img">
    <img src="https://repuestos.ventuscorp.cl/wp-content/uploads/2024/11/logo-image.svg" class="logo-footer" alt="" decoding="async" loading="lazy"/>
    </div>
  </header>
  <body>
    <!-- Pantalla -->
    <div id="pantalla-despiece" class="tabla-scroll">
      <div id="sidebar">
        <a href="index.html" class="side-link active" data-id="inicio">
          <img type="img" src="Icon/home-alt.png" class="icon"/>
          <span class="text">Inicio</span>
        </a>
        <a href="despiece.html" class="side-link" data-id="despiece">
          <img type="img" src="Icon/department-store.png" class="icon"/>
          <span class="text">Despiece</span>
        </a>
        <a href="lista.html" class="side-link" data-id="lista">
          <img type="img" src="Icon/table-list.png" class="icon"/>
          <span class="text">Lista</span>
        </a>
        <a href="Cotizador/index.html" class="side-link" data-id="cotizador" target="_blank">
          <img type="img" src="Icon/file-detail.png" class="icon"/>
          <span class="text">Cotizador</span>
        </a>
        <a href="logistica.html" class="side-link" data-id="logistica">
          <img type="img" src="Icon/warehouse.png" class="icon"/>
          <span class="text">Logística</span>
        </a>
        <a href="Comex.html" class="side-link" data-id="comex">
          <img type="img" src="Icon/globe-americas.png" class="icon"/>
          <span class="text">Comex</span>
        </a>
        <a href="Acceso.html" class="side-link" data-id="Configuracion">
          <img type="img" src="Icon/cog.png" class="icon"/>
          <span class="text">Config.</span>
        </a>
      </div>
      <!-- Tabla Datos -->
      <table id="grilla-comex">
        <thead>
          <button class="btn-export-excel" onclick="exportarComexExcel()">Exportar a Excel</button>
          <tr>
            <th style="position: relative;">
              <span class="titulo-columna">Orden</span>
              <input class="filtro-columna" onkeyup="filtrarTabla(this)" placeholder="Buscar" type="text"/>
            </th>
            <th style="position: relative;">
              <span class="titulo-columna">Posición</span>
              <input class="filtro-columna" onkeyup="filtrarTabla(this)" placeholder="Buscar" type="text"/>
            </th>
            <th style="position: relative;">
              <span class="titulo-columna">Código SAP</span>
              <input class="filtro-columna" onkeyup="filtrarTabla(this)" placeholder="Buscar" type="text"/>
            </th>
            <th style="position: relative;">
              <span class="titulo-columna">Descripción</span>
              <input class="filtro-columna" onkeyup="filtrarTabla(this)" placeholder="Buscar" type="text"/>
            </th>
            <th style="position: relative;">
              <span class="titulo-columna">Almacén</span>
              <input class="filtro-columna" onkeyup="filtrarTabla(this)" placeholder="Buscar" type="text"/>
            </th>
            <th style="position: relative;">
              <span class="titulo-columna">Cantidad</span>
              <input class="filtro-columna" onkeyup="filtrarTabla(this)" placeholder="Buscar" type="text"/>
            </th>
            <th style="position: relative;">
              <span class="titulo-columna">ETA</span>
              <input class="filtro-columna" onkeyup="filtrarTabla(this)" placeholder="Buscar" type="text"/>
            </th>
            <th style="position: relative;">
              <span class="titulo-columna">Fecha Llegada</span>
              <input class="filtro-columna" onkeyup="filtrarTabla(this)" placeholder="Buscar" type="text"/>
            </th>
            <th style="position: relative;">
              <span class="titulo-columna">Seguimiento</span>
              <input class="filtro-columna" onkeyup="filtrarTabla(this)" placeholder="Buscar" type="text"/>
            </th>
            <th style="position: relative;">
              <span class="titulo-columna">Solicitante</span>
              <input class="filtro-columna" onkeyup="filtrarTabla(this)" placeholder="Buscar" type="text"/>
            </th>
          </tr>
        </thead>
        <tbody id="comex-body"></tbody>
      </table>
    </div>
    <!-- Datos -->
    <script src="OrdenCompra.js"></script>
    <script src="repuestos.js"></script>
    <script src="script-Comex.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  </body>
  <footer>
    <!-- Pie de Página -->
    <div class="col-md-12 sidebar text-center">
      <aside id="text-8" class="widget widget_text">
        <div class="textwidget">
          <p style="color: white";">Abaldu® V 2.0</p>
        </div>
      </aside>
    </div>
  </footer>
</html>
